[output_pin probe_enable]
pin: PA8
value: 0

[gcode_macro PROBE_DOWN]
gcode:
    SET_PIN PIN=probe_enable VALUE=1

[gcode_macro PROBE_UP]
gcode:
    SET_PIN PIN=probe_enable VALUE=0

[probe]
pin: ^!PC4
deactivate_on_each_sample: False
x_offset: 24
y_offset: 36
z_offset: 4  # будет перезаписан в SAVE_CONFIG после PROBE_CALIBRATE
speed: 10.0
samples: 2
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.1
samples_tolerance_retries: 1
activate_gcode:
    PROBE_DOWN
    G4 P500
deactivate_gcode:
    PROBE_UP

[safe_z_home]
home_xy_position: 103.5,74                                                      # CAUTION! Depends on probe X/Y offset
z_hop: 5
move_to_previous: True                                                       # Return back ~X0/Y0 after Z0 at center
z_hop_speed: 10
speed: 50

#### меш стола. щуп покрывает Y только [36, 220], X [24, 255] — передний/левый край не мешуются.
[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 25, 36
mesh_max: 240, 215
probe_count: 5, 5
algorithm: bicubic
fade_start: 1
fade_end: 10

### регулировка положения стола
[bed_screws] # BED_SCREWS_ADJUST
screw1: 28,31
screw1_name: front left screw
screw2: 228,31
screw2_name: front right screw
screw3: 228,181
screw3_name: back right screw
screw4: 28,181
screw4_name: back left screw
speed: 150

#### авторегулировка винтов по щупу. координаты сопла такие, чтобы щуп встал над винтом.
#### щуп справа+сзади сопла (x_offset +24, y_offset +36), передняя пара паркуется в край Y=0 — ближе не достаёт.
#### порядок: сначала дальние (back), потом ближние (front). screw1 = референс, его не крутим.
[screws_tilt_adjust]
screw1: 4, 145
screw1_name: back left screw
screw2: 204, 145
screw2_name: back right screw
screw3: 4, 2
screw3_name: front left screw
screw4: 204, 2
screw4_name: front right screw
horizontal_move_z: 10
speed: 100
screw_thread: CW-M4

[gcode_macro G29]
gcode:
    BED_MESH_CLEAR
    G28
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE SAVE=name
    SAVE_CONFIG
    BED_MESH_PROFILE LOAD=name
