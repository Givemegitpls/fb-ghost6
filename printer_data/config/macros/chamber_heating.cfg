# Прогрев термокамеры: стол + радиатор экструдера + вентилятор + iHeater.
# Завершается по достижению температуры камеры (не по таймеру, как раньше).
# Вся логика нагрева/помощи — в M191/M141 (см. configs/iHeater.cfg).
#
# Параметры:
#   TEMP    — целевая температура камеры, °C (по умолчанию 50)
#   BED     — температура стола, °C (по умолчанию 90)
#   HOTEND  — температура сопла/радиатора, °C (по умолчанию 220)
#   FAN     — вентилятор обдува для циркуляции, 0..255 (по умолчанию 255)
#
# Нагреватели остаются включёнными после завершения — печать можно начинать сразу.
[gcode_macro CHAMBER_HEATING]
description: Прогрев камеры (стол + сопло + iHeater) до TEMP, ожидание по датчику камеры
gcode:
    {% set chamber = params.TEMP|default(params.S)|default(50)|int %}
    {% set bed = params.BED|default(90)|int %}
    {% set hotend = params.HOTEND|default(220)|int %}
    {% set fan = params.FAN|default(255)|int %}

    G28
    G90
    G1 X127 Y105 F7800             ; центр, чтобы сопло не упиралось в стол
    M191 S{chamber} B{bed} E{hotend} F{fan}
